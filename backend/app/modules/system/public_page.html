<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title | Solar Care</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #13281f; background: #f5f8f5; }
    * { box-sizing: border-box; }
    body { margin: 0; line-height: 1.65; }
    header { background: #103b2c; color: #fff; }
    nav { display: flex; align-items: center; flex-wrap: wrap; gap: .75rem 1.4rem; max-width: 62rem;
      margin: auto; padding: 1rem 1.25rem; }
    nav a { color: inherit; text-underline-offset: .25em; }
    nav .brand { margin-right: auto; font-weight: 750; text-decoration: none; }
    main { width: min(100% - 2rem, 50rem); margin: clamp(1rem, 7vw, 5rem) auto;
      padding: clamp(1.25rem, 5vw, 3.75rem); background: #fff; border: 1px solid #dae7de; border-radius: 1.25rem; }
    h1 { font-size: clamp(2rem, 6vw, 3.25rem); letter-spacing: -.045em; line-height: 1.1; margin: 0 0 1rem; }
    h2 { margin: 1.75rem 0 .4rem; font-size: 1.2rem; }
    p { margin: 0 0 1.25rem; max-width: 65ch; }
    main > :last-child { margin-bottom: 0; }
    a { color: #166047; text-underline-offset: .2em; }
    a:focus-visible { outline: 3px solid #c3811e; outline-offset: 4px; }
    .muted { color: #496258; }
    .cards { display: grid; gap: .875rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); }
    .card { border: 1px solid #c7ded1; border-radius: .8rem; padding: 1rem; background: #eef6f0; }
    .card span { display: block; margin-top: .4rem; color: #253f34; }
    .card:hover { background: #e3f1e8; }
    dt { margin-top: .75rem; font-weight: 700; }
    dd { margin: 0; overflow-wrap: anywhere; }
    .address { white-space: pre-line; }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Support navigation">
      <a class="brand" href="/">Solar Care</a>
      <a href="/privacy-policy">Privacy Policy</a>
      <a href="/contact-us">Contact Us</a>
    </nav>
  </header>
  <main>$content</main>
</body>
</html>
